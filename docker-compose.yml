
services:
  ai-research-arena:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-research-arena

    ports:
      - "127.0.0.1:8000:8000"

    # Il file .env è facoltativo: senza, si usano i provider gratuiti.
    env_file:
      - path: .env
        required: false

    restart: unless-stopped
